<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#082d4c" />
  <title>Confidence Construtora — Obras que deixam marca</title>
  <meta name="description" content="Confidence Construtora — atuação, obras, certificações e contato em uma experiência SPA." />
  <style>
    :root {
      --blue: #105584;
      --blue-dark: #082d4c;
      --blue-deep: #041d34;
      --blue-soft: #7097b0;
      --blue-light: #d9e8f1;
      --paper: #f4f7f9;
      --white: #ffffff;
      --line: #cad9e3;
      --ink: #12283b;
      --muted: #607587;
      --gold: #c6973d;
      --nav-h: 76px;
      --page-x: clamp(22px, 5vw, 76px);
      --max: 1440px;
      --shadow: 0 24px 70px rgba(8,45,76,.15);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--paper); }
    body { margin: 0; color: var(--ink); background: var(--paper); overflow-x: hidden; }
    body.detail-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    img { display: block; max-width: 100%; }
    ::selection { background: var(--blue); color: white; }

    fixed-nav { display:block; }
    site-shell, home-view, work-detail, territory-map, works-showcase { display:block; }

    .nav {
      position: fixed;
      z-index: 1000;
      inset: 0 0 auto;
      height: var(--nav-h);
      border-bottom: 1px solid rgba(202,217,227,.75);
      background: rgba(255,255,255,.93);
      backdrop-filter: blur(16px);
    }
    .nav-inner {
      width: min(var(--max), calc(100% - 2 * var(--page-x)));
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .brand { margin-right: auto; display:inline-flex; align-items:center; }
    .brand img { width: 196px; height: auto; }
    .nav-links { display:flex; align-items:center; gap:24px; font-size:12px; font-weight:800; letter-spacing:.035em; text-transform:uppercase; color:var(--blue-dark); }
    .nav-links a { position:relative; padding:30px 0 27px; }
    .nav-links a::after { content:""; position:absolute; left:0; right:100%; bottom:18px; height:2px; background:var(--blue); transition:right .2s ease; }
    .nav-links a:hover::after, .nav-links a.active::after { right:0; }
    .nav-cta { border:1px solid var(--blue); background:var(--blue); color:white; padding:10px 15px; font-size:12px; font-weight:850; cursor:pointer; }
    .menu { display:none; border:0; background:transparent; width:42px; height:42px; font-size:24px; cursor:pointer; }

    .screen {
      width: 100%;
      height: 100svh;
      min-height: 660px;
      position: relative;
      overflow: hidden;
      scroll-margin-top: var(--nav-h);
    }
    .screen-inner {
      width: min(var(--max), calc(100% - 2 * var(--page-x)));
      height: 100%;
      margin: auto;
      padding-top: calc(var(--nav-h) + clamp(34px, 6vh, 72px));
      padding-bottom: clamp(34px, 6vh, 72px);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .eyebrow { font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:900; color:var(--blue); }
    .eyebrow.light { color:#7fc1e8; }
    .title {
      font-size: clamp(42px, 5.6vw, 82px);
      line-height: .95;
      letter-spacing: -.055em;
      color: var(--blue-dark);
      margin: 11px 0 18px;
      max-width: 990px;
    }
    .copy { color:var(--muted); line-height:1.65; font-size:clamp(15px, 1.3vw, 19px); max-width:740px; margin:0; }
    .rule { height:1px; background:var(--line); width:100%; }

    /* 1 — HERO */
    .hero { color:white; background:var(--blue-dark); }
    .hero-media { position:absolute; inset:0; overflow:hidden; background:var(--blue-dark); }
    .hero-slide { position:absolute; inset:-2%; background-position:center 43%; background-size:cover; background-repeat:no-repeat; opacity:0; transform:scale(1.08); transition:transform 2.4s ease; will-change:opacity,transform; }
    .hero-slide.active { opacity:1; transform:scale(1.015); }
    .hero-media::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 72% 28%, rgba(255,255,255,.08), transparent 22%), radial-gradient(circle at 22% 78%, rgba(255,255,255,.05), transparent 18%); pointer-events:none; }
    .hero-filter { position:absolute; inset:0; background:linear-gradient(90deg, rgba(4,29,52,.96) 0%, rgba(4,29,52,.80) 46%, rgba(4,29,52,.37) 74%, rgba(4,29,52,.54) 100%), linear-gradient(180deg, rgba(4,29,52,.08), rgba(4,29,52,.64)); }
    .hero-inner { position:relative; z-index:2; width:min(var(--max), calc(100% - 2 * var(--page-x))); height:100%; margin:auto; padding-top:calc(var(--nav-h) + 30px); padding-bottom:54px; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(280px,.42fr); gap:72px; align-items:end; }
    .hero-identity-stage { display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start; margin-bottom:22px; }
    .hero-brand-phase, .hero-title-phase { display:block; width:100%; }
    .hero-brand-phase { margin-bottom:clamp(24px,3.2vh,38px); }
    .hero-logo { width:clamp(360px, 40vw, 610px); max-width:78vw; margin:0; }
    .hero-title-phase { max-width:850px; }
    .hero h1 { font-size:clamp(44px,5.9vw,88px); line-height:.88; letter-spacing:-.065em; margin:9px 0 0; max-width:850px; text-transform:uppercase; }
    .hero h1 span { color:#c9dce8; font-weight:350; }
    .hero-lead { font-size:clamp(16px,1.45vw,21px); line-height:1.55; color:#dce9f1; max-width:720px; margin:0; }
    .hero-actions { display:flex; gap:12px; margin-top:30px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; border:1px solid rgba(255,255,255,.62); background:transparent; color:white; padding:12px 17px; min-height:45px; font-size:12px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; transition:.2s ease; }
    .btn:hover { background:white; color:var(--blue-dark); }
    .btn.white { background:white; color:var(--blue-dark); border-color:white; }
    .btn.white:hover { background:#dfeaf1; }
    .hero-aside { align-self:end; border-top:1px solid rgba(255,255,255,.55); padding-top:20px; margin-bottom:10px; }
    .hero-aside strong { display:block; font-size:clamp(28px,3vw,44px); line-height:1; letter-spacing:-.05em; }
    .hero-aside p { color:#c6d9e5; line-height:1.55; font-size:14px; }
    .hero-indicator { position:absolute; z-index:3; right:var(--page-x); bottom:22px; font-size:10px; text-transform:uppercase; letter-spacing:.18em; color:#d5e5ef; writing-mode:vertical-rl; }

    /* 2 — INSTITUCIONAL · UMA ÚNICA SESSÃO */
    .institutional-unified { background:#fff; }
    .institutional-unified .screen-inner {
      justify-content:flex-start;
      gap:clamp(18px,2.4vh,28px);
      padding-top:calc(var(--nav-h) + clamp(26px,3.4vh,42px));
      padding-bottom:clamp(26px,3.4vh,42px);
    }
    .institutional-unified-head {
      display:grid;
      grid-template-columns:minmax(0,.88fr) minmax(360px,.72fr);
      gap:clamp(34px,5vw,72px);
      align-items:end;
      padding-bottom:clamp(18px,2.6vh,26px);
      border-bottom:1px solid var(--line);
    }
    .institutional-unified-head .title {
      margin-bottom:0;
      font-size:clamp(42px,4.7vw,70px);
      max-width:780px;
    }
    .institutional-unified-head .copy {
      max-width:610px;
      font-size:clamp(14px,1.15vw,17px);
      padding-bottom:5px;
    }
    .institutional-stage {
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);
      gap:18px;
    }
    .institutional-photo {
      min-height:0;
      position:relative;
      overflow:hidden;
      border-radius:24px;
      background:url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1800&q=88') center/cover no-repeat;
    }
    .institutional-photo::after {
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(8,45,76,.02) 36%,rgba(8,45,76,.72) 100%);
    }
    .photo-caption {
      position:absolute;
      z-index:2;
      left:24px;
      right:24px;
      bottom:20px;
      padding-top:14px;
      border-top:1px solid rgba(255,255,255,.66);
      color:white;
      display:flex;
      justify-content:space-between;
      gap:24px;
      font-size:11px;
      letter-spacing:.02em;
    }
    .institutional-side {
      min-height:0;
      display:grid;
      grid-template-rows:auto auto 1fr;
      gap:14px;
    }
    .institutional-statement {
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--paper);
      padding:clamp(20px,2.4vw,30px);
    }
    .institutional-statement.primary {
      background:var(--blue-dark);
      border-color:var(--blue-dark);
      color:white;
    }
    .institutional-statement .eyebrow { margin-bottom:10px; }
    .institutional-statement.primary .eyebrow { color:#86bedf; }
    .institutional-statement h3 {
      margin:0;
      color:var(--blue-dark);
      font-size:clamp(24px,2.15vw,34px);
      line-height:1.02;
      letter-spacing:-.045em;
    }
    .institutional-statement.primary h3 { color:white; }
    .institutional-statement p {
      margin:12px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.55;
    }
    .institutional-statement.primary p { color:#c8dce8; }
    .institutional-values-compact {
      min-height:0;
      border-radius:20px;
      background:#0a3558;
      color:white;
      padding:clamp(18px,2vw,26px);
      display:flex;
      flex-direction:column;
      container-type:inline-size;
    }
    .institutional-values-title {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding-bottom:14px;
      border-bottom:1px solid rgba(255,255,255,.2);
    }
    .institutional-values-title strong {
      font-size:18px;
      letter-spacing:-.025em;
    }
    .institutional-values-title span {
      color:#8fc2df;
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-weight:900;
    }
    .values-compact-grid {
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
      gap:8px;
      margin-top:14px;
      align-content:stretch;
    }
    .value-compact {
      min-width:0;
      min-height:78px;
      padding:12px 14px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:12px;
      background:rgba(255,255,255,.035);
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
    }
    .value-compact:first-child,
    .value-compact:last-child { padding-left:14px; padding-right:14px; border-right:1px solid rgba(255,255,255,.11); }
    .value-compact span {
      color:#82badb;
      font-size:9px;
      font-weight:900;
      letter-spacing:.12em;
    }
    .value-compact strong {
      display:block;
      margin-top:7px;
      font-size:clamp(14px,1.15vw,18px);
      line-height:1.08;
      letter-spacing:-.03em;
      overflow-wrap:anywhere;
    }
    .value-compact p {
      margin:5px 0 0;
      color:#b8cedc;
      font-size:10px;
      line-height:1.35;
    }

    territory-map { display:block; width:100%; height:100%; }
    works-showcase { display:flex; flex-direction:column; width:100%; height:100%; min-height:0; }

    /* 3 + 4 — MAPA + OBRAS / UMA ÚNICA SEÇÃO */
    .portfolio-region { background:linear-gradient(180deg,var(--paper) 0%,var(--paper) 44%,#fff 44%,#fff 100%); }
    .portfolio-region-inner { width:min(var(--max), calc(100% - 2 * var(--page-x))); margin:auto; padding:calc(var(--nav-h) + clamp(26px,3.8vh,46px)) 0 clamp(56px,7vh,88px); }
    .portfolio-region territory-map { height:auto; }
    .portfolio-region .territory-grid { min-height:calc(100svh - var(--nav-h) - clamp(78px,9vh,110px)); }
    .portfolio-works-block { margin-top:clamp(48px,7vh,86px); padding-top:clamp(34px,5vh,56px); border-top:1px solid var(--line); scroll-margin-top:calc(var(--nav-h) + 18px); }
    .portfolio-works-block works-showcase { height:auto; min-height:0; }

    /* MAP */
    .territory { background:var(--paper); }
    .territory-grid { height:100%; display:grid; grid-template-columns:minmax(390px,.82fr) minmax(0,1.18fr); gap:clamp(34px,5vw,74px); align-items:center; }
    .territory-intro { min-width:0; }
    .territory-intro .title { font-size:clamp(42px,4.7vw,68px); margin-bottom:13px; }
    .territory-intro .copy { max-width:565px; }
    .city-columns { margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:0 22px; border-top:1px solid var(--line); max-height:min(48vh,470px); overflow:auto; padding-right:8px; }
    .city-button { border-bottom:1px solid var(--line); color:var(--muted); min-height:58px; padding:9px 0; text-align:left; cursor:default; display:grid; grid-template-columns:8px minmax(0,1fr); gap:9px; align-items:start; outline:none; }
    .city-button::before { content:""; width:6px; height:6px; margin-top:5px; background:var(--blue-soft); }
    .city-button-copy { min-width:0; display:grid; gap:3px; }
    .city-name { color:var(--blue-dark); font-size:11px; line-height:1.2; font-weight:900; letter-spacing:.015em; }
    .city-work { width:max-content; max-width:100%; border:0; padding:0; background:transparent; color:var(--muted); font:inherit; font-size:9px; line-height:1.35; font-weight:800; text-align:left; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; transition:color .18s ease, transform .18s ease; }
    .city-work::after { content:" ↗"; opacity:.58; }
    .city-button:hover::before, .city-button.active::before, .city-button:focus-within::before { background:var(--blue); }
    .city-button:hover .city-name, .city-button.active .city-name, .city-button:focus-within .city-name { color:var(--blue); }
    .city-button.active .city-work, .city-work:hover, .city-work:focus-visible { color:var(--blue-dark); transform:translateX(2px); }
    .map-stage { height:min(74vh,700px); position:relative; background:var(--blue-dark); overflow:hidden; box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.08); }
    .map-stage::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 72% 22%,rgba(112,151,176,.23),transparent 34%),linear-gradient(135deg,#082d4c,#061f35); }
    .bahia-map { position:absolute; z-index:2; inset:5.5% 7% 7%; width:86%; height:87.5%; overflow:visible; }
    .ibge-municipality { fill:#eef4f7; stroke:#7e9daf; stroke-width:.43; vector-effect:non-scaling-stroke; transition:fill .16s ease,stroke .16s ease,opacity .16s ease; }
    .ibge-municipality.is-portfolio { fill:#d3e0e8; cursor:pointer; stroke:#5f8399; stroke-width:.62; }
    .ibge-municipality.is-portfolio:hover, .ibge-municipality.active { fill:#4b90bc; stroke:#fff; stroke-width:1.5; filter:drop-shadow(0 3px 5px rgba(0,0,0,.25)); }
    .map-loading { position:absolute; z-index:4; inset:0; display:grid; place-items:center; color:#d3e3ec; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:900; }
    .map-loading.hidden { display:none; }
    .map-error { max-width:330px; text-align:center; line-height:1.6; color:#d7e5ed; text-transform:none; letter-spacing:0; font-weight:650; }
    .map-meta { position:absolute; z-index:4; right:22px; top:20px; color:white; text-align:right; pointer-events:none; }
    .map-meta strong { display:block; font-size:12px; }
    .map-meta span { display:block; font-size:9px; color:#a8c6d7; margin-top:4px; text-transform:uppercase; letter-spacing:.1em; }
    .map-current { position:absolute; z-index:4; left:20px; bottom:18px; color:white; border-top:1px solid rgba(255,255,255,.45); padding-top:11px; min-width:230px; max-width:min(330px,70%); }
    .map-current span { display:block; color:#9fc1d5; font-size:9px; letter-spacing:.14em; text-transform:uppercase; }
    .map-current strong { display:block; margin-top:4px; font-size:19px; letter-spacing:-.03em; }
    .map-current a { display:inline-flex; align-items:center; gap:6px; margin-top:5px; color:#d8e8f1; font-size:10px; line-height:1.35; font-weight:850; text-decoration:none; border-bottom:1px solid rgba(216,232,241,.42); padding-bottom:2px; transition:color .18s ease,border-color .18s ease,transform .18s ease; }
    .map-current a::after { content:"↗"; font-size:10px; }
    .map-current a:hover, .map-current a:focus-visible { color:white; border-color:white; transform:translateX(2px); outline:none; }

    /* 4 — WORKS */
    .works { background:white; }
    .portfolio-works-block { background:transparent; }
    .works-head { display:flex; justify-content:space-between; align-items:end; gap:30px; margin-bottom:clamp(15px,2.3vh,26px); }
    .works-head .title { margin-bottom:0; font-size:clamp(40px,4.8vw,68px); }
    .works-count { color:var(--blue-soft); font-size:10px; font-weight:900; letter-spacing:.09em; text-transform:uppercase; padding-bottom:7px; }
    .works-scatter { flex:none; min-height:0; position:relative; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:clamp(20px,2.6vh,30px) 0; overflow:hidden; background:linear-gradient(180deg,#f9fbfd 0%,#f1f5f8 100%); }
    .works-scatter::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(8,45,76,.018) 1px,transparent 1px),linear-gradient(rgba(8,45,76,.018) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; }
    .works-network { display:none; }
    .works-grid { position:relative; z-index:1; height:auto; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(230px,1fr)); grid-auto-rows:minmax(230px,1fr); gap:clamp(14px,1.4vw,22px); padding:clamp(14px,1.7vw,24px); }
    .work-card { position:relative; overflow:hidden; border:1px solid #d8e4eb; padding:0; background:var(--blue-dark); cursor:pointer; text-align:left; min-width:0; min-height:230px; aspect-ratio:16/9; box-shadow:0 14px 30px rgba(8,45,76,.09); isolation:isolate; transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease; border-radius:16px; transform:none !important; }
    .work-card:nth-child(n){grid-column:auto;grid-row:auto;transform:none!important;border-radius:16px}
    .work-card img { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:cover; background:#d9e4eb; transition:transform .55s cubic-bezier(.2,.7,.2,1), filter .32s ease; }
    .work-card::before { content:""; position:absolute; z-index:1; inset:0; background:linear-gradient(180deg,rgba(4,29,52,.02) 18%,rgba(4,29,52,.16) 42%,rgba(4,29,52,.94) 100%); }
    .work-card::after { content:""; position:absolute; z-index:1; inset:auto 0 0; height:3px; background:var(--green); transform:scaleX(0); transform-origin:left; transition:transform .3s ease; }
    .work-card:hover { transform:translateY(-6px) scale(1.012)!important; box-shadow:0 28px 56px rgba(8,45,76,.20); border-color:#b7cfdd; }
    .work-card:hover img { transform:scale(1.06); filter:saturate(1.08) contrast(1.02); }
    .work-card:hover::after { transform:scaleX(1); }
    .work-card-content { position:absolute; z-index:2; inset:auto 18px 16px; color:white; }
    .work-city { font-size:8px; letter-spacing:.11em; text-transform:uppercase; font-weight:900; color:#c5dbe8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .work-card h3 { font-size:clamp(18px,1.55vw,24px); line-height:1.02; letter-spacing:-.04em; margin:7px 0 0; max-width:92%; }
    .work-card:nth-child(1) h3, .work-card:nth-child(5) h3 { font-size:clamp(21px,1.9vw,29px); }
    .work-card p { display:none; }
    .work-arrow { position:absolute; z-index:3; right:12px; top:12px; width:30px; height:30px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.68); color:white; font-size:15px; transition:.2s ease; background:rgba(4,29,52,.25); border-radius:999px; }
    .work-card:hover .work-arrow { background:white; color:var(--blue-dark); border-color:white; transform:translate(1px,-1px); }
    .works-more { margin-top:11px; display:flex; justify-content:space-between; gap:20px; color:var(--muted); font-size:10px; }
    .works-more button { border:0; background:transparent; color:var(--blue); font-weight:900; text-transform:uppercase; letter-spacing:.05em; cursor:pointer; }

    /* 5 — CLIENTS · STANDARD STACKED SECTION */
    .clients { background:var(--blue-dark); color:white; }
    .clients .screen-inner { justify-content:flex-start; }
    .clients .title { color:white; font-size:clamp(42px,5vw,72px); margin-bottom:10px; }
    .clients .copy { color:#c7dbe8; }
    .clients-layout { height:100%; width:100%; display:flex; flex-direction:column; gap:clamp(22px,3.5vh,38px); align-items:stretch; }
    .clients-layout > div:first-child { width:100%; padding-bottom:clamp(18px,2.5vh,26px); border-bottom:1px solid rgba(255,255,255,.22); }

    const CITIES = [...new Set(WORKS.map(work => work.city))].map(name => ({name}));

    function* stateIterator(initial) {
      let state = Object.freeze({...initial});
      while (true) {
        const action = yield state;
        if (!action) continue;
        switch(action.type) {
          case 'ROUTE': state = Object.freeze({...state, route:action.route, slug:action.slug ?? null}); break;
          case 'CITY': state = Object.freeze({...state, activeCity:action.city}); break;
          case 'MOBILE_NAV': state = Object.freeze({...state, mobileNav:!!action.open}); break;
        }
      }
    }

    class AppState extends EventTarget {
      constructor() {
        super();
        this.machine = stateIterator({ route:'home', slug:null, activeCity:'Vitória da Conquista', mobileNav:false });
        this.snapshot = this.machine.next().value;
      }
      dispatch(action) {
        const step = this.machine.next(action);
        if (!step.done) this.snapshot = step.value;
        this.dispatchEvent(new CustomEvent('change', {detail:this.snapshot}));
        return this.snapshot;
      }
    }
    const appState = new AppState();

    const escapeHTML = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

    function routeFromHash() {
      const hash = location.hash.replace(/^#\/?/, '');
      const match = hash.match(/^obra\/(.+)$/);
      if (match) appState.dispatch({type:'ROUTE', route:'detail', slug:decodeURIComponent(match[1])});
      else appState.dispatch({type:'ROUTE', route:'home'});
    }

    function navigateHome(anchor='inicio') {
      if (location.hash.startsWith('#/obra/')) history.pushState(null,'',location.pathname + location.search + '#/');
      appState.dispatch({type:'ROUTE', route:'home'});
      requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView({behavior:'smooth'}));
    }

    function openWork(slug) {
      history.pushState(null,'',`#/obra/${encodeURIComponent(slug)}`);
      appState.dispatch({type:'ROUTE', route:'detail', slug});
    }

    function mountHeroSlideshow(root) {
      const media = root.querySelector('.hero-media');
      if (!media || media.dataset.bound === '1') return () => {};
      media.dataset.bound = '1';
      media.innerHTML = HERO_SLIDES.map((slide, index) => `<div class="hero-slide${index === 0 ? ' active' : ''}" style="background-image:url('${slide.image}')" aria-hidden="true"></div>`).join('');
      const slides = [...media.querySelectorAll('.hero-slide')];
      let timer = null;
      const rapidStepMs = 780;
      const pauseMs = 3600;

      const setActive = index => {
        slides.forEach((slide, slideIndex) => slide.classList.toggle('active', slideIndex === index));
      };

      const runSequence = () => {
        let step = 0;
        const advance = () => {
          setActive(step);
          const isLast = step === slides.length - 1;
          step += 1;
          timer = window.setTimeout(isLast ? runSequence : advance, isLast ? pauseMs : rapidStepMs);
        };
        advance();
      };

      runSequence();
      return () => { if (timer) window.clearTimeout(timer); };
    }

    const normalizeName = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
    const worksForCity = city => WORKS.filter(work => normalizeName(work.city) === normalizeName(city));
    const cityPortfolioLabel = city => {
      const matches = worksForCity(city);
      return matches.map(work=>work.name).join(' · ');
    };

    let bahiaGeometryPromise;
    async function loadBahiaGeometry(){
      if (bahiaGeometryPromise) return bahiaGeometryPromise;
      bahiaGeometryPromise = (async()=>{
        const ibge = new URL('https://servicodados.ibge.gov.br/api/v3/malhas/estados/29');
        ibge.searchParams.set('formato','application/vnd.geo+json');
        ibge.searchParams.set('qualidade','minima');
        ibge.searchParams.set('intrarregiao','municipio');
        try {
          const [geoRes, cityRes] = await Promise.all([
            fetch(ibge.toString()),
            fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/29/municipios')
          ]);
          if(!geoRes.ok || !cityRes.ok) throw new Error('IBGE indisponível');
          const [geo,cities] = await Promise.all([geoRes.json(),cityRes.json()]);
          const byCode = new Map(cities.map(city=>[String(city.id),city.nome]));
          geo.features.forEach(feature=>{
            const p=feature.properties ||= {};
            const code=String(p.codarea ?? p.id ?? feature.id ?? '');
            p.__name = p.nome ?? p.name ?? p.NM_MUN ?? byCode.get(code) ?? '';
          });
          if(!geo.features?.length) throw new Error('Malha vazia');
          return geo;
        } catch(error) {
          const fallback=await fetch('https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-29-mun.json');
          if(!fallback.ok) throw error;
          const geo=await fallback.json();
          geo.features.forEach(feature=>{ const p=feature.properties ||= {}; p.__name=p.name ?? p.nome ?? p.description ?? ''; });
          return geo;
        }
      })();
      return bahiaGeometryPromise;
    }

    function geometryPoints(geometry){
      const points=[];
      const walk=node=>{
        if(!Array.isArray(node)) return;
        if(typeof node[0]==='number' && typeof node[1]==='number') points.push(node);
        else node.forEach(walk);
      };
      walk(geometry?.coordinates);
      return points;
    }

    function geometryToPath(geometry, project){
      const ringPath=ring=>ring.map((point,index)=>`${index?'L':'M'}${project(point).join(' ')}`).join(' ')+' Z';
      if(geometry.type==='Polygon') return geometry.coordinates.map(ringPath).join(' ');
      if(geometry.type==='MultiPolygon') return geometry.coordinates.flatMap(poly=>poly.map(ringPath)).join(' ');
      return '';
    }

    class TerritoryMap extends HTMLElement {
      connectedCallback(){
        this.render();
        this.addEventListener('mouseover', e=>{ const target=e.target.closest('[data-city]'); if(target) appState.dispatch({type:'CITY',city:target.dataset.city}); });
        this.addEventListener('focusin', e=>{ const target=e.target.closest('[data-city]'); if(target) appState.dispatch({type:'CITY',city:target.dataset.city}); });
        this.addEventListener('click', e=>{
          const workLink=e.target.closest('[data-work-link]');
          if(workLink){ e.preventDefault(); openWork(workLink.dataset.workLink); return; }

          const municipality=e.target.closest('.ibge-municipality.is-portfolio[data-city]');
          if(municipality) {
            const work=worksForCity(municipality.dataset.city)[0];
            appState.dispatch({type:'CITY',city:municipality.dataset.city});
            if(work) openWork(work.slug);
            return;
          }

          const target=e.target.closest('[data-city]');
          if(target) appState.dispatch({type:'CITY',city:target.dataset.city});
        });

        this.addEventListener('keydown', e=>{
          if(e.key !== 'Enter' && e.key !== ' ') return;
          const municipality=e.target.closest('.ibge-municipality.is-portfolio[data-city]');
          if(!municipality) return;
          e.preventDefault();
          const work=worksForCity(municipality.dataset.city)[0];
          appState.dispatch({type:'CITY',city:municipality.dataset.city});
          if(work) openWork(work.slug);
        });
        appState.addEventListener('change',this._onState=e=>this.update(e.detail));
        this.loadMap();
        this.update(appState.snapshot);
      }
      disconnectedCallback(){ appState.removeEventListener('change',this._onState); }
      update(state){
        this.querySelectorAll('[data-city]').forEach(el=>el.classList.toggle('active',normalizeName(el.dataset.city)===normalizeName(state.activeCity)));
        const current=this.querySelector('[data-current-city]'); if(current) current.textContent=state.activeCity;
        const currentWork=this.querySelector('[data-current-work]');
        if(currentWork) {
          const work=worksForCity(state.activeCity)[0];
          if(work) {
            currentWork.textContent=work.name;
            currentWork.href=`#/obra/${encodeURIComponent(work.slug)}`;
            currentWork.dataset.workLink=work.slug;
            currentWork.setAttribute('aria-label',`Abrir a obra ${work.name} em ${work.city}`);
          } else {
            currentWork.textContent='';
            currentWork.removeAttribute('href');
            delete currentWork.dataset.workLink;
          }
        }
      }
      render(){
        const cityButtons=WORKS.map(work=>`<div class="city-button" data-city="${escapeHTML(work.city)}" tabindex="0"><span class="city-button-copy"><span class="city-name">${escapeHTML(work.city)}</span><a class="city-work" href="#/obra/${encodeURIComponent(work.slug)}" data-work-link="${escapeHTML(work.slug)}" aria-label="Abrir a obra ${escapeHTML(work.name)} em ${escapeHTML(work.city)}">${escapeHTML(work.name)}</a></span></div>`).join('');
        this.innerHTML=`<div class="territory-grid">
          <div class="territory-intro">
            <div class="eyebrow">Nossas obras na Bahia</div>
            <h2 class="title">Obras que levam nossa marca pelo estado.</h2>
            <p class="copy">De Vitória da Conquista ao litoral, nossa engenharia está presente em diferentes municípios, tipos de obra e frentes de execução.</p>
            <div class="city-columns">${cityButtons}</div>
          </div>
          <div class="map-stage">
            <div class="map-meta"><strong>Bahia</strong><span>Municípios com obras Confidence</span></div>
            <svg class="bahia-map" viewBox="0 0 620 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa real dos municípios da Bahia"></svg>
            <div class="map-loading" data-map-loading>Carregando mapa da Bahia…</div>
            <div class="map-current"><span>Nossa obra em destaque</span><strong data-current-city>Vitória da Conquista</strong><a href="#/obra/${encodeURIComponent(worksForCity('Vitória da Conquista')[0]?.slug || '')}" data-current-work data-work-link="${escapeHTML(worksForCity('Vitória da Conquista')[0]?.slug || '')}">${escapeHTML(cityPortfolioLabel('Vitória da Conquista'))}</a></div>
          </div>
        </div>`;
      }
      async loadMap(){
        const svg=this.querySelector('.bahia-map');
        const loading=this.querySelector('[data-map-loading]');
        try {
          const geo=await loadBahiaGeometry();
          const all=geo.features.flatMap(feature=>geometryPoints(feature.geometry));
          const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
          const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
          const W=620,H=720,pad=14;
          const scale=Math.min((W-pad*2)/(maxX-minX),(H-pad*2)/(maxY-minY));
          const usedW=(maxX-minX)*scale, usedH=(maxY-minY)*scale;
          const offX=(W-usedW)/2, offY=(H-usedH)/2;
          const project=([x,y])=>[(offX+(x-minX)*scale).toFixed(2),(H-(offY+(y-minY)*scale)).toFixed(2)];
          const tracked=new Map(CITIES.map(({name})=>[normalizeName(name),name]));
          svg.innerHTML=geo.features.map(feature=>{
            const name=feature.properties?.__name ?? feature.properties?.name ?? feature.properties?.nome ?? '';
            const canonical=tracked.get(normalizeName(name));
            const cls=`ibge-municipality${canonical?' is-portfolio':''}`;
            const work=canonical?worksForCity(canonical)[0]:null;
            const data=canonical?` data-city="${escapeHTML(canonical)}" data-work-slug="${escapeHTML(work?.slug || '')}" tabindex="0" role="link" aria-label="Abrir obra em ${escapeHTML(canonical)}"`:'';
            return `<path class="${cls}"${data} d="${geometryToPath(feature.geometry,project)}"><title>${escapeHTML(name)}</title></path>`;
          }).join('');
          loading?.classList.add('hidden');
          this.update(appState.snapshot);
        } catch(error) {
          if(loading) loading.innerHTML='<div class="map-error">Não foi possível carregar o mapa da Bahia. Verifique a conexão e tente novamente.</div>';
          console.error(error);
        }
      }
    }
    customElements.define('territory-map', TerritoryMap);

          ].filter(Boolean);
          const url=`https://wa.me/${BRAND.whatsapp}?text=${encodeURIComponent(lines.join('\n'))}`;
          window.open(url,'_blank','noopener,noreferrer');
        });
      }

    class WorkDetail extends HTMLElement {
      static get observedAttributes(){ return ['slug']; }
      attributeChangedCallback(){ if(this.isConnected) this.render(); }
      connectedCallback(){ this.render(); this.addEventListener('click',e=>{ if(e.target.closest('[data-back]')) navigateHome('obras'); }); }
      render(){
        const work=WORKS.find(w=>w.slug===this.getAttribute('slug')) || WORKS[0];
        this.innerHTML=`<main class="detail-route">
          <section class="detail-workspace">
            <div class="detail-gallery-panel" aria-label="Galeria de imagens da obra">
              <div class="detail-gallery-grid">
                ${work.photos.map((src,i)=>`<figure class="detail-gallery-item"><img src="${src}" alt="${escapeHTML(work.name)} — foto ${i+1}"><span class="detail-gallery-index">${String(i+1).padStart(2,'0')}</span></figure>`).join('')}
              </div>
            </div>
            <aside class="detail-sidebar" aria-label="Informações e serviços da obra">
              <button class="detail-back" data-back>← Voltar às obras</button>
              <div class="eyebrow">${escapeHTML(work.city)} · ${escapeHTML(work.state)}</div>
              <h1>${escapeHTML(work.name)}</h1>
              <p class="detail-summary">${escapeHTML(work.summary)}</p>

              <div class="detail-identification" aria-label="Identificação da obra">
                <div class="detail-data-row"><span>Cidade</span><strong>${escapeHTML(work.city)}</strong></div>
                <div class="detail-data-row"><span>Tipo de obra</span><strong>${escapeHTML(work.type)}</strong></div>
              </div>

              <section class="detail-services" aria-labelledby="services-title">
                <div class="detail-services-head">
                  <div>
                    <div class="eyebrow">O que executamos</div>
                    <h2 id="services-title">Serviços realizados</h2>
                  </div>
                  <span class="detail-services-count">${work.services.length} serviços</span>
                </div>
                <div class="service-list">
                  ${work.services.map((s,i)=>`<div class="service-item"><span>${String(i+1).padStart(2,'0')}</span><strong>${escapeHTML(s)}</strong></div>`).join('')}
                </div>
              </section>

              <div class="detail-sidebar-foot">Confidence Construtora · Engenharia que deixa marca</div>
            </aside>
          </section>
        </main>`;
      }
    }
    customElements.define('work-detail', WorkDetail);

    class SiteShell extends HTMLElement {
      connectedCallback(){
        this.innerHTML='<fixed-nav></fixed-nav><div id="route-slot"></div>';
        this.slotEl=this.querySelector('#route-slot');
        appState.addEventListener('change', this._onState=e=>this.renderRoute(e.detail));
        routeFromHash();
        if (!this.slotEl.childElementCount) this.renderRoute(appState.snapshot);
      }
      disconnectedCallback(){ appState.removeEventListener('change', this._onState); }
      renderRoute(state){
        document.body.classList.toggle('detail-open', state.route==='detail');
        if(state.route==='detail') {
          if(!(this.slotEl.firstElementChild instanceof WorkDetail)) this.slotEl.innerHTML='<work-detail></work-detail>';
          this.slotEl.firstElementChild.setAttribute('slug', state.slug || WORKS[0].slug);
          this.slotEl.firstElementChild.querySelector('.detail-route')?.scrollTo(0,0);
        } else {
          if(!(this.slotEl.firstElementChild instanceof HomeView)) this.slotEl.innerHTML='<home-view></home-view>';
        }
      }
    }
    customElements.define('site-shell', SiteShell);

    window.addEventListener('hashchange', routeFromHash);
    window.addEventListener('popstate', routeFromHash);
  </script>
