            if(crud.dataset.cmsCardAdd!==undefined){this.openAddRecord(crud.dataset.cmsCardAdd);return;}
            if(crud.dataset.cmsCardEdit!==undefined){this.openRecordEdit(crud.dataset.cmsCardEdit);return;}
            if(crud.dataset.cmsCardRemove!==undefined){this.removeRecord(crud.dataset.cmsCardRemove);return;}
          }
          if(e.target.closest('[data-record-edit-cancel]')){e.preventDefault();this.editingRecordId=null;this.render();return;}
          if(e.target.closest('[data-record-edit-save]')){e.preventDefault();this.saveRecordEdit();return;}
          const nav=e.target.closest('[data-record-carousel-nav]');
          if(nav){e.preventDefault();this.changeCarousel(nav.dataset.recordCarouselNav,Number(nav.dataset.direction||0));return;}
          const thumb=e.target.closest('[data-record-carousel-thumb]');
          if(thumb){e.preventDefault();this.selectCarousel(thumb.dataset.recordCarouselThumb,Number(thumb.dataset.imageIndex));return;}
          const toggle=e.target.closest('[data-record-position-toggle]');
          if(toggle){e.preventDefault();this.toggleImagePosition(toggle.dataset.recordPositionToggle);return;}
          const reset=e.target.closest('[data-record-position-reset]');
          if(reset){e.preventDefault();this.resetImagePosition(reset.dataset.recordPositionReset);return;}
          if(e.target.matches('[data-record-draft-image-input]')) return;
          const add=e.target.closest('[data-cms-record-add]');
          if(add) { e.preventDefault(); this.openAddRecord(); return; }
          if(e.target.closest('[data-record-draft-remove-image]')) { e.preventDefault(); this.removeRecordDraftImage(Number(e.target.closest('[data-record-draft-remove-image]').dataset.recordDraftRemoveImage)); return; }
          if(e.target.closest('[data-record-draft-image]')) { if(e.target.closest('input,button')) return; e.preventDefault(); this.querySelector('[data-record-draft-image-input]')?.click(); return; }
          const galleryAdd=e.target.closest('[data-work-gallery-add]'); if(galleryAdd){ this.querySelector('[data-work-gallery-input]')?.click(); return; }
          const galleryRemove=e.target.closest('[data-work-gallery-remove]'); if(galleryRemove){ e.preventDefault(); this.removeGalleryPhoto(Number(galleryRemove.dataset.workGalleryRemove)); return; }
          const extraAdd=e.target.closest('[data-record-extra-add]'); if(extraAdd){ e.preventDefault(); this.addRecordImages(extraAdd.dataset.recordExtraAdd); return; }
          const extraRemove=e.target.closest('[data-record-extra-remove]'); if(extraRemove){ e.preventDefault(); this.removeRecordImage(extraRemove.dataset.recordExtraRemove,Number(extraRemove.dataset.recordExtraIndex)); return; }
          if(e.target.closest('[data-record-draft-cancel]')) { e.preventDefault(); this.cancelRecordDraft(); return; }
          if(e.target.closest('[data-record-draft-save]')) { e.preventDefault(); this.addRecord(); return; }
          const remove=e.target.closest('[data-cms-record-remove]');
          if(remove) { e.preventDefault(); this.removeRecord(remove.dataset.cmsRecordRemove); return; }
          if(e.target.closest('[data-back]')) { navigateHome('obras'); return; }
          if(e.target.closest('[data-services-jump]')) {
            this.querySelector('#execucao')?.scrollIntoView({behavior:'smooth',block:'start'});
            return;
          }
          if(e.target.closest('[data-contact]')) { navigateHome('contato'); return; }
        });
        this.addEventListener('change',e=>{
          if(e.target.matches('[data-record-draft-image-input]')) { this.pickRecordDraftImages([...e.target.files]); e.target.value=''; }
          if(e.target.matches('[data-work-gallery-input]')) { this.addGalleryPhotos([...e.target.files]); e.target.value=''; }
          if(e.target.matches('[data-record-extra-input]')) { this.stageRecordExtraImages(e.target.dataset.recordExtraInput,[...e.target.files]); e.target.value=''; }
        });
        this.addEventListener('input',e=>{
          const slider=e.target.closest('[data-record-image-position]');
          if(slider){this.previewImagePosition(slider);return;}
          const field=e.target.dataset.recordDraftInput;
          if(field && this.recordDraft) this.recordDraft[field]=e.target.value;
        });
        this.addEventListener('change',e=>{
          const slider=e.target.closest('[data-record-image-position]');
          if(slider) this.saveImagePosition(slider);
        });
        this.addEventListener('keydown',e=>{
          const viewport=e.target.closest('[data-record-carousel-viewport]');
          if(!viewport || !['ArrowLeft','ArrowRight'].includes(e.key) || e.target.matches('input,button')) return;
          e.preventDefault();this.changeCarousel(viewport.dataset.recordCarouselViewport,e.key==='ArrowRight'?1:-1);
        });
        this.addEventListener('pointerdown',e=>this.carouselPointerDown(e));
        this.addEventListener('pointermove',e=>this.carouselPointerMove(e));
        this.addEventListener('pointerup',e=>this.carouselPointerEnd(e));
        this.addEventListener('pointercancel',e=>this.carouselPointerEnd(e,true));
        this.addEventListener('dragover',e=>{
          if(e.target.closest('[data-work-gallery-add],[data-record-draft-image]')) e.preventDefault();
        });
        this.addEventListener('drop',e=>{
          if(e.target.closest('[data-work-gallery-add]')) { e.preventDefault(); this.addGalleryPhotos([...e.dataTransfer.files]); }
          if(e.target.closest('[data-record-draft-image]')) { e.preventDefault(); this.pickRecordDraftImages([...e.dataTransfer.files]); }
        });
      }
      currentWork(){
        return WORKS.find(w=>w.slug===this.getAttribute('slug')) || WORKS[0] || null;
      }
      recordById(id){return this.currentWork()?.activities?.find(a=>String(a.id)===String(id)) || null;}
      recordCarousel(id){return [...this.querySelectorAll('[data-record-carousel]')].find(el=>el.dataset.recordCarousel===String(id)) || null;}
      selectedIndex(id){
        const count=activityImages(this.recordById(id)).length;
        return Math.max(0,Math.min(this.carouselIndices?.get(String(id))||0,Math.max(0,count-1)));
      }
      selectCarousel(id,index){
        const activity=this.recordById(id), carousel=this.recordCarousel(id);
        if(!activity || !carousel)return;
        const count=activityImages(activity).length;
        if(!count)return;
        const selected=Math.max(0,Math.min(Math.trunc(index)||0,count-1));
        this.carouselIndices.set(String(id),selected);
        carousel.querySelectorAll('[data-record-slide]').forEach((el,i)=>{
          const active=i===selected;el.classList.toggle('is-active',active);el.setAttribute('aria-hidden',String(!active));
          el.querySelector('img')?.setAttribute('loading',active?'eager':'lazy');
        });
        carousel.querySelectorAll('[data-record-carousel-thumb]').forEach((el,i)=>{
          const active=i===selected;el.classList.toggle('is-active',active);
          el.setAttribute('aria-current',active?'true':'false');
          if(active)el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
        });
        const counter=carousel.querySelector('[data-record-carousel-count]');
        if(counter)counter.textContent=`${selected+1} / ${count}`;
        const navPrev=carousel.querySelector('[data-direction="-1"]');
        const navNext=carousel.querySelector('[data-direction="1"]');
        if(navPrev)navPrev.disabled=count<2;
        if(navNext)navNext.disabled=count<2;
        const positionPanel=carousel.querySelector('[data-record-position-controls]');
        if(positionPanel && !positionPanel.hidden)this.fillPositionSliders(id,selected);
      }
      changeCarousel(id,direction){
        const count=activityImages(this.recordById(id)).length;
        if(!count)return;
        this.selectCarousel(id,(this.selectedIndex(id)+direction+count)%count);
      }
      fillPositionSliders(id,index){
        const carousel=this.recordCarousel(id);if(!carousel)return;
        const position=activityImagePositions(this.recordById(id))[index]||{x:50,y:50};
        for(const axis of ['x','y']){
          const slider=carousel.querySelector(`[data-record-image-position="${axis}"]`);
          if(slider)slider.value=position[axis];
          const out=carousel.querySelector(`[data-record-position-output="${axis}"]`);
          if(out)out.textContent=`${position[axis]}%`;
        }
      }
      toggleImagePosition(id){
        if(!cmsState.token)return navigateLogin();
        const carousel=this.recordCarousel(id),panel=carousel?.querySelector('[data-record-position-controls]');
        const viewport=carousel?.querySelector('[data-record-carousel-viewport]');
        if(!panel || !viewport)return;
        panel.hidden=!panel.hidden;
        viewport.classList.toggle('is-adjusting',!panel.hidden);
        if(!panel.hidden)this.fillPositionSliders(id,this.selectedIndex(id));
      }
      previewImagePosition(slider){
        const carousel=slider.closest('[data-record-carousel]');if(!carousel)return;
        const id=carousel.dataset.recordCarousel;
        const position=activityImagePositions(this.recordById(id))[this.selectedIndex(id)]||{x:50,y:50};
        const x=carousel.querySelector('[data-record-image-position="x"]');
        const y=carousel.querySelector('[data-record-image-position="y"]');
        const px=clampImagePosition(x?.value??position.x),py=clampImagePosition(y?.value??position.y);
        this.previewSelectedPosition(id,px,py);
      }
      previewSelectedPosition(id,x,y){
        const carousel=this.recordCarousel(id);if(!carousel)return;
        const image=carousel.querySelector('.service-record-slide.is-active img');
        if(image)image.style.objectPosition=`${x}% ${y}%`;
        for(const axis of ['x','y']){
          const out=carousel.querySelector(`[data-record-position-output="${axis}"]`);
          if(out)out.textContent=`${axis==='x'?x:y}%`;
        }
      }
      saveImagePosition(slider){
        const carousel=slider.closest('[data-record-carousel]');if(!carousel)return;
        const id=carousel.dataset.recordCarousel,index=this.selectedIndex(id);
        const x=carousel.querySelector('[data-record-image-position="x"]');
        const y=carousel.querySelector('[data-record-image-position="y"]');
        this.commitImagePosition(id,index,clampImagePosition(x?.value),clampImagePosition(y?.value));
      }
      commitImagePosition(id,index,x,y){
        if(!cmsState.token)return;
        const activity=this.recordById(id);if(!activity)return;
        const positions=activityImagePositions(activity);
        if(index<0 || index>=positions.length)return;
        const previous=positions[index];
        if(previous.x===x && previous.y===y)return;
        const previousList=cmsClone(positions);
        const work=this.currentWork();
        cmsRegisterChange({key:`record-position:${work.slug}:${id}:${index}`,label:`Enquadramento: ${activity.title} (foto ${index+1})`,
          undo:()=>{activity.imagePositions=previousList;this.normalizeWorkMedia(work);}});
        positions[index]={x,y};
        activity.imagePositions=positions;
        SITE_DATA.works=WORKS;cmsState.content.works=WORKS;
        this.previewSelectedPosition(id,x,y);
      }
      resetImagePosition(id){
        const carousel=this.recordCarousel(id);if(!carousel)return;
        this.commitImagePosition(id,this.selectedIndex(id),50,50);
        this.fillPositionSliders(id,this.selectedIndex(id));
      }
      carouselPointerDown(e){
        const viewport=e.target.closest('[data-record-carousel-viewport]');
        if(!viewport || e.target.closest('button,input') || this.pointerGesture)return;
        const id=viewport.dataset.recordCarouselViewport,index=this.selectedIndex(id);
        const adjusting=viewport.classList.contains('is-adjusting') && !!cmsState.token;
        if(!adjusting && e.pointerType==='mouse')return;
        const position=activityImagePositions(this.recordById(id))[index]||{x:50,y:50};
        this.pointerGesture={pointerId:e.pointerId,viewport,id,index,adjusting,x:e.clientX,y:e.clientY,
          base:{...position},newPosition:{...position}};
        if(adjusting){e.preventDefault();viewport.setPointerCapture?.(e.pointerId);}
      }
      carouselPointerMove(e){
        const g=this.pointerGesture;
        if(!g || g.pointerId!==e.pointerId || !g.adjusting)return;
        const box=g.viewport.getBoundingClientRect();
        // The image follows the drag direction; object-position itself moves in reverse.
        const x=clampImagePosition(g.base.x-(e.clientX-g.x)*100/Math.max(1,box.width));
        const y=clampImagePosition(g.base.y-(e.clientY-g.y)*100/Math.max(1,box.height));
        g.newPosition={x,y};
        const carousel=this.recordCarousel(g.id);
        const sliderX=carousel?.querySelector('[data-record-image-position="x"]');
        const sliderY=carousel?.querySelector('[data-record-image-position="y"]');
        if(sliderX)sliderX.value=x;if(sliderY)sliderY.value=y;
        this.previewSelectedPosition(g.id,x,y);
      }
      carouselPointerEnd(e,cancel=false){
        const g=this.pointerGesture;
        if(!g || g.pointerId!==e.pointerId)return;
        this.pointerGesture=null;
        if(g.adjusting){
          if(!cancel)this.commitImagePosition(g.id,g.index,g.newPosition.x,g.newPosition.y);
          else this.previewSelectedPosition(g.id,g.base.x,g.base.y);
          if(g.viewport.hasPointerCapture?.(e.pointerId))g.viewport.releasePointerCapture(e.pointerId);
        } else if(!cancel){
          const dx=e.clientX-g.x,dy=e.clientY-g.y;
          if(Math.abs(dx)>42 && Math.abs(dx)>Math.abs(dy)*1.25) this.changeCarousel(g.id,dx<0?1:-1);
        }
      }
      normalizeWorkMedia(work){
        work.activities ||= [];
        work.gallery ||= [];
        for(const activity of work.activities){
          activity.images=activityImages(activity);
          activity.imagePositions=activityImagePositions(activity);
          activity.image=activity.images[0] || '';
        }
        work.photos=[...new Set([...work.activities.flatMap(activity=>activity.images),...work.gallery].filter(Boolean))];
        if(!work.cover) work.cover=work.photos[0] || '';
      }
      async persistWorkChange(){
        SITE_DATA.works=WORKS;
        cmsState.content.works=WORKS;
        this.render();
        requestAnimationFrame(()=>{cmsApply(this);cmsEditor?.updateSaveFooter();});
      }
      revokeRecordDraftPreview(){
        for(const preview of (this.recordDraft?.imagePreviews||[])) if(preview?.startsWith('blob:')) URL.revokeObjectURL(preview);
      }
      cancelRecordDraft(){
        this.revokeRecordDraftPreview();
        this.recordDraft=null;
        this.render(); requestAnimationFrame(()=>{cmsApply(this);cmsEditor?.updateSaveFooter();});
      }
      openAddRecord(afterId=null){
        if(afterId) this.insertRecordAfterId=afterId;
        else this.insertRecordAfterId=null;
        if(!cmsState.token) { navigateLogin(); return; }
        if(!this.recordDraft){
          this.recordDraft={title:'',description:'',imageFiles:[],imagePreviews:[]};
          this.render();
          requestAnimationFrame(()=>{cmsApply(this);this.querySelector('[data-record-draft-session]')?.scrollIntoView({behavior:'smooth',block:'center'});});
        } else this.querySelector('[data-record-draft-session]')?.scrollIntoView({behavior:'smooth',block:'center'});
      }
      pickRecordDraftImages(files){
        if(!this.recordDraft) return;
        const images=files.filter(file=>file?.type?.startsWith('image/'));
        for(const file of images){
          this.recordDraft.imageFiles.push(file);
          this.recordDraft.imagePreviews.push(URL.createObjectURL(file));
        }
        if(images.length){this.render();requestAnimationFrame(()=>cmsApply(this));}
      }
      removeRecordDraftImage(index){
        if(!this.recordDraft || index<0) return;
        const preview=this.recordDraft.imagePreviews.splice(index,1)[0];
        this.recordDraft.imageFiles.splice(index,1);
        if(preview?.startsWith('blob:')) URL.revokeObjectURL(preview);
        this.render();
      }
      async addGalleryPhotos(files){
        if(!cmsState.token) return navigateLogin();
        const work=this.currentWork(); if(!work) return;
        const valid=files.filter(f=>f?.type?.startsWith('image/'));
        if(!valid.length) return;
        work.gallery ||= [];
        const batch=`gallery:${work.slug}:${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
        const staged=valid.map((file,i)=>({key:`${batch}:${i}`,url:cmsStageAsset(file,`${batch}:${i}`,`galeria-${work.slug}`)}));
        cmsRegisterChange({key:batch,label:`Galeria de ${work.name}: ${staged.length} imagem(ns)`,undo:()=>{
          for(const item of staged){work.gallery=work.gallery.filter(url=>url!==item.url);cmsRemovePendingAsset(item.key);}
          this.normalizeWorkMedia(work);cmsState.content.works=WORKS;
        }});
        work.gallery.push(...staged.map(item=>item.url));
        this.normalizeWorkMedia(work);
        await this.persistWorkChange();
      }
      async removeGalleryPhoto(index){
        if(!cmsState.token) return navigateLogin();
        const work=this.currentWork();
        if(!work || !work.gallery?.[index]) return;
        const url=work.gallery[index];
        const key=`gallery-remove:${work.slug}:${Date.now().toString(36)}:${index}`;
        cmsRegisterChange({key,label:`Remover imagem da galeria: ${work.name}`,undo:()=>{if(!work.gallery.includes(url)) work.gallery.splice(Math.min(index,work.gallery.length),0,url);this.normalizeWorkMedia(work);}});
        work.gallery.splice(index,1);
        this.normalizeWorkMedia(work);
        await this.persistWorkChange();
      }
      addRecordImages(id){ this.querySelectorAll('[data-record-extra-input]').forEach(input=>{if(input.dataset.recordExtraInput===id) input.click();}); }
      async stageRecordExtraImages(id,files){
        if(!cmsState.token) return navigateLogin();
        const work=this.currentWork();
        const activity=work?.activities?.find(item=>String(item.id)===String(id));
        const valid=files.filter(file=>file?.type?.startsWith('image/'));
        if(!activity || !valid.length) return;
        const before=activityImages(activity);
        const beforePositions=activityImagePositions(activity);
        const batch=`record-images:${work.slug}:${id}:${Date.now().toString(36)}`;
        const staged=valid.map((file,i)=>({key:`${batch}:${i}`,url:cmsStageAsset(file,`${batch}:${i}`,`registro-${work.slug}`)}));
        cmsRegisterChange({key:batch,label:`Imagens do registro: ${activity.title}`,undo:()=>{
          for(const item of staged) cmsRemovePendingAsset(item.key);
          activity.images=before;activity.imagePositions=beforePositions;activity.image=before[0] || '';
          this.normalizeWorkMedia(work);
        }});
        activity.images=[...before,...staged.map(item=>item.url)];
        activity.imagePositions=[...beforePositions,...staged.map(()=>({x:50,y:50}))];
        activity.image=activity.images[0];
        this.normalizeWorkMedia(work);
        await this.persistWorkChange();
      }
      async removeRecordImage(id,index){
        if(!cmsState.token) return navigateLogin();
        const work=this.currentWork();
        const activity=work?.activities?.find(item=>String(item.id)===String(id));
        if(!activity) return;
        const before=activityImages(activity);
        const beforePositions=activityImagePositions(activity);
        if(!before[index]) return;
        cmsRegisterChange({key:`record-image-remove:${id}:${index}:${Date.now()}`,label:`Retirar imagem: ${activity.title}`,undo:()=>{activity.images=before;activity.imagePositions=beforePositions;activity.image=before[0] || '';this.normalizeWorkMedia(work);}});
        activity.images=before.filter((_,i)=>i!==index);
        activity.imagePositions=beforePositions.filter((_,i)=>i!==index);
        this.carouselIndices.set(String(id),Math.max(0,Math.min(index-1,activity.images.length-1)));
        activity.image=activity.images[0] || '';
        this.normalizeWorkMedia(work);
        await this.persistWorkChange();
      }
      async addRecord(){
        if(!cmsState.token) { navigateLogin(); return; }
        const work=this.currentWork();
        const draft=this.recordDraft;
        if(!work || !draft) return;
        const title=String(draft.title||'').trim();
        const description=String(draft.description||'').trim();
        if(!title) { alert('Clique no campo Título e preencha o registro.'); return; }
        if(!description) { alert('Clique no campo Descrição e preencha o registro.'); return; }
        if(!draft.imageFiles?.length) { alert('Selecione ao menos uma foto para o registro.'); return; }
        const button=this.querySelector('[data-record-draft-save]');
        const status=this.querySelector('[data-record-draft-status]');
        if(button) button.disabled=true;
        if(status) status.textContent='Adicionando registro ao rascunho…';
        try {
          work.activities ||= [];
          const id=createActivityId(work);
          const changeKey=`record-add:${work.slug}:${id}`;
          const images=draft.imageFiles.map((file,i)=>cmsStageAsset(file,`${changeKey}:image:${i}`,`registro-${work.slug}`));
          cmsRegisterChange({key:changeKey,label:`Novo registro: ${title} (${images.length} fotos)`,undo:()=>{ for(let i=0;i<images.length;i++) cmsRemovePendingAsset(`${changeKey}:image:${i}`); work.activities=(work.activities||[]).filter(item=>String(item.id)!==String(id)); this.normalizeWorkMedia(work); SITE_DATA.works=WORKS; cmsState.content.works=WORKS; }});
          const index=this.insertRecordAfterId ? work.activities.findIndex(a=>String(a.id)===String(this.insertRecordAfterId)) : -1;
          work.activities.splice(index<0?work.activities.length:index+1,0,{id,title,image:images[0],images,imagePositions:images.map(()=>({x:50,y:50})),description});
          this.insertRecordAfterId=null;
          this.normalizeWorkMedia(work);
          this.revokeRecordDraftPreview();
          this.recordDraft=null;
          await this.persistWorkChange();

            activity.title=before.title;activity.description=before.description;
            SITE_DATA.works=WORKS;cmsState.content.works=WORKS;

          activity.title=title;activity.description=description;

        await this.persistWorkChange();

    /* Video strip, scoped to current page, independently saved via the CMS draft. */
    class RecordVideoRail extends HTMLElement {
      connectedCallback(){
        this._keydown=e=>{if(e.key==='Escape'){this.closePlayer();if(this.composing){this.composing=false;this.render();}}};
        document.addEventListener('keydown',this._keydown);
        this.addEventListener('click',this._click=e=>{
          const open=e.target.closest('[data-video-open]');if(open){this.openPlayer(open.dataset.videoOpen);return;}
          if(e.target.closest('[data-video-add]')){this.composing=true;this.render();return;}
          if(e.target.closest('[data-video-cancel]')){this.composing=false;this.render();return;}
          const remove=e.target.closest('[data-video-remove]');if(remove){this.removeVideo(remove.dataset.videoRemove);return;}
          const mute=e.target.closest('[data-video-mute]');if(mute){this.toggleMuted(mute.dataset.videoMute);return;}
        });
        this.addEventListener('submit',this._submit=e=>{
          if(!e.target.matches('[data-video-form]'))return;
          e.preventDefault();this.addVideo(e.target);
        });
        this.render();
      }
      disconnectedCallback(){
        document.removeEventListener('keydown',this._keydown);
        if(this._click)this.removeEventListener('click',this._click);
        if(this._submit)this.removeEventListener('submit',this._submit);
        this.closePlayer();
      }
      scope(){
        const slug=this.getAttribute('work-slug');
        const recordId=this.getAttribute('record-id');
        const work=WORKS.find(w=>w.slug===slug);
        const record=work?.activities?.find(activity=>String(activity.id)===recordId);
        return record ? {type:'record',key:`${slug}:${recordId}`,work,owner:record} : null;
      }
      videos(){const sc=this.scope();return sc && Array.isArray(sc.owner.videos) ? sc.owner.videos : [];}
      syncContent(){
        SITE_DATA.works=WORKS;cmsState.content.works=WORKS;
      }
      render(){
        const sc=this.scope();
        const videos=this.videos();
        const edit=!!cmsState.token;
        const show=!!sc && (videos.length>0 || edit);
        this.hidden=!show;
        if(!show){this.innerHTML='';this.closePlayer();return;}
        this.innerHTML=`<aside class="site-video-rail" aria-label="Vídeos do registro ${escapeHTML(sc.owner.title || sc.key)}">
          <div class="site-video-rail-head">Vídeos</div>
          <div class="site-video-rail-list">${videos.map(v=>`<div class="site-video-item">
            <button class="site-video-thumb" type="button" data-video-open="${escapeHTML(v.id)}" aria-label="Reproduzir vídeo ${escapeHTML(v.title||'da obra')}">
              <video src="${escapeHTML(v.src||'')}" muted playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video>
              <span class="site-video-play">▶</span><span class="site-video-badge">${v.muted!==false?'◁̸':'♫'}</span>
            </button>
            <span class="site-video-name" title="${escapeHTML(v.title||'Vídeo')}">${escapeHTML(v.title||'Vídeo')}</span>
            ${edit?`<div class="site-video-admin"><button type="button" data-video-mute="${escapeHTML(v.id)}" title="Alternar áudio inicial">${v.muted!==false?'Mutado':'Áudio'}</button><button type="button" class="site-video-delete" data-video-remove="${escapeHTML(v.id)}" title="Remover vídeo">×</button></div>`:''}
          </div>`).join('')}</div>
          ${edit?'<button type="button" class="site-video-add" data-video-add>+ Vídeo</button>':''}
        </aside>${edit&&this.composing?`<div class="site-video-compose" role="region" aria-label="Adicionar vídeo">
          <form data-video-form><h3>Adicionar vídeo</h3>
            <label>Título<input name="title" maxlength="100" required placeholder="Ex.: Etapa de acabamento"></label>
            <label>Arquivo de vídeo<input name="file" type="file" accept="video/mp4,video/webm,video/ogg"></label>
            <label>Ou URL pública do vídeo<input name="url" type="url" placeholder="https://.../video.mp4"></label>
            <label class="site-video-check"><input name="muted" type="checkbox" checked> Publicar mutado inicialmente</label>
            <small>Selecione um arquivo MP4/WebM/OGG (até 20 MB) ou informe uma URL HTTPS. O conteúdo fica em rascunho até clicar em <b>Salvar alterações</b>. Vídeos hospedados externamente dependem da disponibilidade do serviço.</small>
            <div class="site-video-error" role="alert" data-video-error></div>
            <div class="site-video-form-actions"><button type="submit">Adicionar ao rascunho</button><button type="button" data-video-cancel>Cancelar</button></div>
          </form>
        </div>`:''}`;
      }
      addVideo(form){
        if(!cmsState.token)return;
        const sc=this.scope();if(!sc)return;
        const title=String(form.elements.namedItem('title')?.value||'').trim();
        const file=form.elements.namedItem('file')?.files?.[0]||null;
        const inputUrl=String(form.elements.namedItem('url')?.value||'').trim();
        const error=form.querySelector('[data-video-error]');
        if(!title){error.textContent='Informe um título.';return;}
        if(!file&&!inputUrl){error.textContent='Selecione um vídeo ou informe uma URL.';return;}
        if(file && (!['video/mp4','video/webm','video/ogg'].includes(file.type)||file.size>20*1024*1024)){
          error.textContent='Arquivo inválido ou superior a 20 MB. Use MP4/WebM/OGG ou URL HTTPS.';return;
        }
        let src=inputUrl;
        if(!file){
          try{const u=new URL(inputUrl);if(u.protocol!=='https:')throw Error('URL deve usar HTTPS');src=u.href;}
          catch(_){error.textContent='Use uma URL HTTPS de arquivo de vídeo acessível publicamente.';return;}
        }
        const id=`video-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
        const changeKey=`video-add:${sc.key}:${id}`;
        if(file)src=cmsStageAsset(file,changeKey,`video-${sc.key}`);
        const video={id,title,src,muted:!!form.elements.namedItem('muted')?.checked};
        const list=sc.owner.videos ||= [];
        cmsRegisterChange({key:changeKey,label:`Adicionar vídeo: ${title}`,undo:()=>{
          sc.owner.videos=(sc.owner.videos||[]).filter(v=>v.id!==id);
          if(file)cmsRemovePendingAsset(changeKey);
          this.syncContent();
        }});
        list.push(video);this.syncContent();this.composing=false;this.render();
        cmsEditor?.updateSaveFooter();
      }
      removeVideo(id){
        if(!cmsState.token)return;
        const sc=this.scope();if(!sc)return;
        const list=sc.owner.videos||[];const index=list.findIndex(v=>v.id===id);if(index<0)return;
        const previous=cmsClone(list[index]);
        if(!confirm(`Remover o vídeo "${previous.title}" deste registro?`))return;
        cmsRegisterChange({key:`video-remove:${sc.key}:${id}`,label:`Remover vídeo: ${previous.title}`,undo:()=>{
          if(!(sc.owner.videos||[]).some(v=>v.id===id))(sc.owner.videos||=[]).splice(Math.min(index,sc.owner.videos.length),0,previous);
          this.syncContent();
        }});
        list.splice(index,1);this.syncContent();this.render();cmsEditor?.updateSaveFooter();
      }
      toggleMuted(id){
        if(!cmsState.token)return;
        const sc=this.scope();if(!sc)return;
        const video=(sc.owner.videos||[]).find(v=>v.id===id);if(!video)return;
        const before=video.muted!==false;
        cmsRegisterChange({key:`video-mute:${sc.key}:${id}`,label:`Áudio inicial: ${video.title}`,undo:()=>{video.muted=before;this.syncContent();}});
        video.muted=!before;this.syncContent();this.render();cmsEditor?.updateSaveFooter();
      }
      openPlayer(id){
        const video=this.videos().find(v=>v.id===id);if(!video)return;
        for(const rail of document.querySelectorAll('record-video-rail')) if(rail!==this)rail.closePlayer();
        this.closePlayer();
        const b=document.createElement('div');b.className='site-video-backdrop';b.setAttribute('role','dialog');b.setAttribute('aria-modal','true');b.setAttribute('aria-label',`Reprodução: ${video.title||'vídeo'}`);
        b.innerHTML=`<div class="site-video-backdrop-top"><strong class="site-video-backdrop-title">${escapeHTML(video.title||'Vídeo')}</strong><button type="button" class="site-video-close" data-video-close aria-label="Fechar vídeo">×</button></div><video class="site-video-player" controls playsinline src="${escapeHTML(video.src||'')}"></video><div class="site-video-player-note">Use os controles do player para ativar ou silenciar o áudio.</div>`;
        document.body.appendChild(b);this.backdrop=b;
        b.addEventListener('click',e=>{if(e.target===b||e.target.closest('[data-video-close]'))this.closePlayer();});
        const player=b.querySelector('video');player.muted=video.muted!==false;
        player.play().catch(()=>{});
        b.querySelector('[data-video-close]')?.focus();
        document.body.classList.add('site-video-viewing');
      }
      closePlayer(){
        if(this.backdrop){const media=this.backdrop.querySelector('video');if(media)media.pause();this.backdrop.remove();this.backdrop=null;}
        document.body.classList.remove('site-video-viewing');
      }
    }
    customElements.define('record-video-rail',RecordVideoRail);

    class SiteShell extends HTMLElement {
      connectedCallback(){
        this.innerHTML='<fixed-nav></fixed-nav><div id="route-slot"></div>';
        this.slotEl=this.querySelector('#route-slot');
        appState.addEventListener('change', this._onState=e=>this.renderRoute(e.detail));
        routeFromHash();
        if (!this.slotEl.childElementCount) this.renderRoute(appState.snapshot);
      }
      disconnectedCallback(){ appState.removeEventListener('change', this._onState); }
      renderRoute(state){
        document.body.classList.toggle('detail-open', state.route==='detail');
        if(state.route==='login') {
          cmsEditor.deactivate();
          if(!(this.slotEl.firstElementChild instanceof CmsLogin)) this.slotEl.innerHTML='<cms-login></cms-login>';
          return;
        }
        if(state.route==='new-work') {
          if(!cmsState.token) { navigateLogin(); return; }
          if(!(this.slotEl.firstElementChild instanceof WorkCreate)) this.slotEl.innerHTML='<work-create></work-create>';
          requestAnimationFrame(()=>cmsEditor.activate());
          return;
        }
        if(state.route==='detail') {
          if(!(this.slotEl.firstElementChild instanceof WorkDetail)) this.slotEl.innerHTML='<work-detail></work-detail>';
          this.slotEl.firstElementChild.setAttribute('slug', state.slug || WORKS[0].slug);
          this.slotEl.firstElementChild.querySelector('.detail-route')?.scrollTo(0,0);
        } else {
          if(!(this.slotEl.firstElementChild instanceof HomeView)) this.slotEl.innerHTML='<home-view></home-view>';
        }
        requestAnimationFrame(()=>{
          cmsApply(this.slotEl);
          if(cmsState.token) cmsEditor.activate();
        });
      }
    }
    customElements.define('site-shell', SiteShell);

    imageRetry.start();

    window.addEventListener('beforeunload',event=>{ if(cmsState.dirty && !cmsLocalPersist('draft')){ event.preventDefault(); event.returnValue=''; } });
    window.addEventListener('hashchange', routeFromHash);
    window.addEventListener('popstate', routeFromHash);
  </script>
</body>
</html>
